name: Daily data sync
on:
  schedule:
    - cron: "10 21 * * *"  # UTC 21:10 = 北京时间 05:10，crontab 兜底
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch public data from site
        run: |
          python3 - <<'PY'
          import urllib.request, os
          os.makedirs("data", exist_ok=True)
          for fn in ("airports.json", "tools.json"):
              urllib.request.urlretrieve("https://myhaiwan.com/data/" + fn, "data/" + fn)
          print("fetched")
          PY
      - name: Render markdown files
        run: python3 scripts/render_promo.py
      - name: Commit and push
        run: |
          git config user.name promo-sync-bot
          git config user.email promo-sync@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "📊 数据自动同步 @ $(date -u -d '+8 hours' +%Y-%m-%d' '%H:%M) (actions兜底)"
          git push
